name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - master
  # Reused by deploy.yml so a deploy only runs after the same checks pass
  workflow_call:
    inputs:
      run-govulncheck:
        description: Run the govulncheck job
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -v ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    if: ${{ github.event_name == 'pull_request' || inputs.run-govulncheck }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Build only: verifies the Dockerfile works. Images are pushed by deploy.yml on master.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64

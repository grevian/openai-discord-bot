name: Instance Status

# Read-only health check of the bot instance over SSM Run Command: service
# states, memory, the collector's RSS and its recent log lines. Changes
# nothing on the instance. Prints no secrets: the bot's own logs are not
# shown, and the collector never logs the Honeycomb key.
on:
  workflow_dispatch:

permissions: {}

env:
  AWS_REGION: ca-central-1

jobs:
  status:
    name: status
    environment: production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 900

      - name: Run checks on the instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=openai-discord-bot" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          echo "Instance: $INSTANCE_ID"
          if [ -z "$INSTANCE_ID" ] || [[ "$INSTANCE_ID" == *[[:space:]]* ]]; then
            echo "::error::expected exactly one running instance, got '$INSTANCE_ID'"
            exit 1
          fi
          CMDS=$(jq -nc --arg s '
          echo "== uptime"; uptime
          echo "== services"; systemctl is-active bot.service otel-collector.service docker.service || true
          echo "== collector unit"; systemctl show otel-collector.service -p ExecMainStartTimestamp -p NRestarts -p MemoryCurrent -p User || true
          echo "== memory (MiB)"; free -m
          echo "== top RSS (KiB)"; ps -eo rss,comm --sort=-rss | head -n 8
          echo "== instance type"; T=$(curl -s -m 5 -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 60" http://169.254.169.254/latest/api/token); curl -s -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-type; echo; uname -m
          echo "== meminfo and swap"; grep -E "^(MemTotal|MemAvailable|SwapTotal|SwapFree):" /proc/meminfo; swapon --show 2>&1 || true
          echo "== cgroup memory (bytes; max/high of max = unlimited)"; for u in bot otel-collector; do echo "-- $u"; for f in memory.current memory.peak memory.high memory.max memory.swap.current memory.events; do echo "$f: $(cat /sys/fs/cgroup/system.slice/$u.service/$f 2>&1 | tr "\n" " ")"; done; done
          echo "== kernel OOM kills this boot (count, then last 5 lines; kernel lines hold no message text)"; journalctl -k -b --no-pager -o cat | grep -ciE "out of memory|oom-kill|killed process" || true; journalctl -k -b --no-pager -o cat | grep -iE "out of memory|oom-kill|killed process" | tail -n 5 | cut -c1-250 || true
          echo "== collector binary"; ls -l /usr/local/bin/otelcol-danbot /usr/local/bin/otelcol-contrib 2>&1 || true
          sha256sum /usr/local/bin/otelcol-danbot 2>&1 || true
          echo "== collector log"; journalctl -u otel-collector.service -n 40 --no-pager -o short-iso | cut -c1-300
          echo "== bot unit"; systemctl show bot.service -p ExecMainStartTimestamp -p NRestarts -p MemoryCurrent -p User -p MainPID || true
          echo "== bot release"; readlink /opt/danbot/current; ls -l /opt/danbot/releases 2>&1 || true
          echo "== bot WARN/ERROR lines in the last 200 (count only: the bot log can hold user text)"; journalctl -u bot.service -n 200 --no-pager -o cat | grep -acE "ERROR|WARN" || true
          echo "== bot unit state"; systemctl show bot.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p ExecMainCode -p NRestarts || true
          echo "== bot start log (prepare lines and systemd own lines only)"; journalctl -u bot.service --no-pager -o cat | grep -a "^danbot-prepare:" | tail -n 5 | cut -c1-200; journalctl -u bot.service _COMM=systemd -n 20 --no-pager -o short-iso | cut -c1-250
          echo "== bot sandbox"; systemd-analyze security bot.service --no-pager 2>&1 | tail -n 2 || true
          echo "== bot container (legacy)"; if command -v docker >/dev/null; then docker ps --format "{{.Names}} {{.Status}} {{.Image}}"; else echo "docker not installed"; fi
          ' '{commands: ($s | split("\n"))}')
          CMD_ID=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" --comment "Instance status (read-only)" \
            --parameters "$CMDS" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "SSM command status: $STATUS"

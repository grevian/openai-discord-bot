name: Instance Refresh

# Replaces the bot's EC2 instance so it boots from the latest launch template
# (user-data: danbot-prepare.sh, the bot.service unit and its flags). The ASG uses version
# "$Latest", so Terraform never sees a change to trigger its own refresh.
on:
  workflow_dispatch:
  # Called by terraform.yml when an apply changed the launch template
  workflow_call:
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
      HONEYCOMB_MARKER_TOKEN:
        required: false

permissions: {}

env:
  AWS_REGION: ca-central-1
  ASG_NAME: openai-discord-bot-prod
  # Fail the job if the refresh has not finished by then (seconds)
  REFRESH_TIMEOUT: "1200"
  # Holds the git sha the instance runs (see deploy.yml)
  SSM_IMAGE_TAG_PARAM: /openai-discord-bot/prod/image_tag

jobs:
  refresh:
    name: refresh
    environment: production
    runs-on: ubuntu-24.04-arm
    # Same group as deploy.yml and terraform.yml: no deploy restarts the bot
    # while the instance is being replaced.
    concurrency: production
    # refresh (20) + the health check below (up to ~25)
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      # Only the local actions (the health check, the marker) are needed from the repo
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Record start time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      - name: Refuse if a refresh is already running
        run: |
          ACTIVE=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress' || Status=='Cancelling' || Status=='RollbackInProgress'].InstanceRefreshId" \
            --output text)
          if [ -n "$ACTIVE" ]; then
            echo "::error::An instance refresh is already running ($ACTIVE); not starting another"
            exit 1
          fi

      # One instance (min = max = 1), so there is no healthy capacity to keep:
      # MinHealthyPercentage=0 terminates the old instance, then launches the
      # new one. The bot is offline until the new instance boots and
      # danbot-prepare.sh has fetched the release (a few minutes).
      # Two bots on one Discord token would fight over the session, so the
      # overlapping variant (min 100, max 200) is deliberately not used.
      - name: Start instance refresh
        id: start
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":0,"InstanceWarmup":60}' \
            --query InstanceRefreshId --output text)
          echo "Started instance refresh $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the refresh to finish
        env:
          REFRESH_ID: ${{ steps.start.outputs.refresh_id }}
        run: |
          DEADLINE=$((SECONDS + REFRESH_TIMEOUT))
          FAILS=0
          while true; do
            if ! OUT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].[Status, StatusReason || '-']" \
              --output text); then
              # A transient API error must not fail the job: AWS keeps refreshing
              FAILS=$((FAILS + 1))
              echo "::warning::could not read refresh status ($FAILS/5)"
              if [ "$FAILS" -ge 5 ]; then
                echo "::error::could not read the status of refresh $REFRESH_ID; it may still be running in AWS"
                exit 1
              fi
              sleep 20
              continue
            fi
            FAILS=0
            read -r STATUS REASON <<< "$OUT"
            echo "Status: $STATUS"
            case "$STATUS" in
              Successful)
                echo "Instance refresh $REFRESH_ID succeeded"
                exit 0 ;;
              Pending|InProgress) ;;
              *)
                # Failed, Cancelling, Cancelled, RollbackInProgress, ...
                echo "::error::Instance refresh $REFRESH_ID ended as $STATUS: $REASON"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Instance refresh $REFRESH_ID still $STATUS after ${REFRESH_TIMEOUT}s; it keeps running in AWS"
              exit 1
            fi
            sleep 20
          done

      # The refresh only proves the ASG replaced the instance: the bot starts
      # minutes later (dnf update, user-data, danbot-prepare). Check that the
      # release in image_tag is up and healthy. Check only: no restart and no
      # rollback, because the old instance is gone. Fresh credentials, since the
      # first ones may be close to expiry after a long refresh.
      - name: Configure AWS Credentials for the health check
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      - name: Read the release the instance should run
        id: tag
        run: |
          TAG=$(aws ssm get-parameter --name "$SSM_IMAGE_TAG_PARAM" --query Parameter.Value --output text)
          if [[ ! "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$SSM_IMAGE_TAG_PARAM does not hold a release sha: '${TAG:0:60}'"
            exit 1
          fi
          echo "sha=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check the bot is healthy on the new instance
        uses: ./.github/actions/bot-health
        with:
          expect-version: ${{ steps.tag.outputs.sha }}
          restart: "false"
          ready-timeout: "600"
          instance-wait: "600"

      - name: Honeycomb marker
        if: success()
        uses: ./.github/actions/honeycomb-marker
        with:
          token: ${{ secrets.HONEYCOMB_MARKER_TOKEN }}
          type: restart
          start-time: ${{ steps.started.outputs.at }}
          message: Instance refresh (bot restarted) ${{ github.workflow }} by ${{ github.actor }}

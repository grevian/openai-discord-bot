name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AWS_REGION: ca-central-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openai-discord-bot
  # The bot runs as a native binary from the private artifacts bucket
  # (terraform/artifacts.tf); the image above is still published.
  ARTIFACTS_BUCKET: openai-discord-bot-prod-artifacts
  RELEASE_NAME: danbot
  RELEASE_FILE: danbot-linux-arm64.tar.gz
  # Holds the git sha the instance runs (the name predates the native binary)
  SSM_IMAGE_TAG_PARAM: /openai-discord-bot/prod/image_tag
  SSM_KAGI_API_KEY_PARAM: /openai-discord-bot/prod/kagi_api_key

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Known-vulnerable dependencies must not block a hotfix deploy; govulncheck gates PRs instead
      run-govulncheck: false
    permissions:
      contents: read

  deploy:
    needs: ci
    environment: production
    runs-on: ubuntu-24.04-arm
    concurrency: production
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same ldflags as the Dockerfile (deploy.version = git sha). The tarball
      # is deterministic, so a re-run of the same commit builds the same bytes.
      - name: Build bot binary
        run: scripts/build-release.sh "${{ github.sha }}" arm64

      # artifacts/<name>/<git sha>/<file> with <file>.sha256 next to it, which
      # the instance checks on every start (fetch-artifact in user-data). A
      # version is never overwritten: a re-run that built other bytes fails.
      - name: Upload bot binary to S3
        run: |
          KEY="artifacts/$RELEASE_NAME/${{ github.sha }}/$RELEASE_FILE"
          SHA=$(awk '{ print $1 }' "dist/$RELEASE_FILE.sha256")
          if ! aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" 2>/dev/null; then
            echo "::error::bucket $ARTIFACTS_BUCKET does not exist yet: run the Terraform workflow, then re-run this workflow"
            exit 1
          fi
          # exists KEY: 0 if the object exists, 1 only on a 404; anything else
          # (throttling, network, AccessDenied) fails the job, so an error can
          # never look like "absent" and bypass the never-overwrite check.
          exists() {
            local err="$RUNNER_TEMP/head-object.err"
            if aws s3api head-object --bucket "$ARTIFACTS_BUCKET" --key "$1" > /dev/null 2> "$err"; then
              return 0
            fi
            if grep -qE '\(404\)|Not Found' "$err"; then
              return 1
            fi
            echo "::error::head-object s3://$ARTIFACTS_BUCKET/$1 failed: $(cat "$err")"
            exit 1
          }
          if exists "$KEY.sha256"; then
            EXISTING=$(aws s3 cp "s3://$ARTIFACTS_BUCKET/$KEY.sha256" - | awk '{ print $1 }')
            if [ "$EXISTING" = "$SHA" ]; then
              echo "s3://$ARTIFACTS_BUCKET/$KEY already holds sha256 $SHA; nothing to do"
              exit 0
            fi
            echo "::error::s3://$ARTIFACTS_BUCKET/$KEY exists with sha256 $EXISTING, this build is $SHA. Versions are never overwritten."
            exit 1
          fi
          # Binary first, checksum last: a fetch never sees a .sha256 for a
          # file that is not there yet.
          aws s3 cp --only-show-errors "dist/$RELEASE_FILE" "s3://$ARTIFACTS_BUCKET/$KEY"
          aws s3 cp --only-show-errors "dist/$RELEASE_FILE.sha256" "s3://$ARTIFACTS_BUCKET/$KEY.sha256"
          echo "Uploaded s3://$ARTIFACTS_BUCKET/$KEY (sha256 $SHA)"
          {
            echo "### Bot binary ${{ github.sha }}"
            echo
            echo "- key: \`$KEY\`"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The release the instance runs now, the target if this one is unhealthy.
      # Only a sha whose artifact is in the bucket counts: rolling back needs no
      # rebuild, but older shas (before the native binary) have an image only.
      # Empty on a re-run of the same commit or a first deploy: no rollback.
      - name: Remember the previous release
        id: prev
        run: |
          PREV=$(aws ssm get-parameter --name "$SSM_IMAGE_TAG_PARAM" \
            --query Parameter.Value --output text 2>/dev/null || true)
          if [[ ! "$PREV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::image_tag holds no release sha ('${PREV:0:60}'); no rollback target"
            PREV=
          elif [ "$PREV" = "${{ github.sha }}" ]; then
            echo "::notice::image_tag already holds this commit; no rollback target"
            PREV=
          elif ! aws s3api head-object --bucket "$ARTIFACTS_BUCKET" \
            --key "artifacts/$RELEASE_NAME/$PREV/$RELEASE_FILE.sha256" > /dev/null 2>&1; then
            echo "::warning::no artifact for the previous release $PREV; no rollback target"
            PREV=
          fi
          echo "sha=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release (rollback target): ${PREV:-none}"

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "${{ env.SSM_IMAGE_TAG_PARAM }}" \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

      # The bot reads the key from SSM when it starts (danbot-prepare.sh), so this
      # runs before the restart. The parameter itself is created by terraform.
      - name: Sync Kagi API key to SSM
        env:
          KAGI_API_KEY: ${{ secrets.KAGI_API_KEY }}
        run: |
          if [ -z "$KAGI_API_KEY" ]; then
            echo "::notice::KAGI_API_KEY secret is not set; link summaries stay disabled"
            exit 0
          fi
          ERR_FILE="$RUNNER_TEMP/kagi-ssm-get.err"
          if ! CURRENT=$(aws ssm get-parameter --name "$SSM_KAGI_API_KEY_PARAM" --with-decryption \
            --query 'Parameter.Value' --output text 2>"$ERR_FILE"); then
            # Only a missing parameter means "not created yet"; anything else
            # (usually AccessDenied) is reported as its own error.
            if grep -q 'ParameterNotFound' "$ERR_FILE"; then
              echo "::warning::$SSM_KAGI_API_KEY_PARAM does not exist yet; run the Terraform workflow, then deploy again"
            elif grep -q 'AccessDenied' "$ERR_FILE"; then
              echo "::error::AccessDenied reading $SSM_KAGI_API_KEY_PARAM. The deploy role needs ssm:GetParameter on it (and kms:Decrypt on its key). The Kagi key was not synced."
            else
              echo "::error::could not read $SSM_KAGI_API_KEY_PARAM: $(cat "$ERR_FILE")"
            fi
            exit 0
          fi
          if [ "$CURRENT" = "$KAGI_API_KEY" ]; then
            echo "Kagi API key is up to date"
            exit 0
          fi
          aws ssm put-parameter --name "$SSM_KAGI_API_KEY_PARAM" --value "$KAGI_API_KEY" \
            --type SecureString --overwrite > /dev/null
          echo "Kagi API key updated"

      # Restarts the bot, then waits for GET /healthz on the instance to answer
      # 200 with this release's sha and for the service to stay up. The step
      # never fails on its own (fail-on-unhealthy false, continue-on-error): the
      # steps below read its result, so a bad release rolls back exactly once.
      # result: ok | fail (instance answered, release unhealthy) | error (the
      # check could not run: the release state is unknown, so no rollback).
      - name: Restart bot and check its health
        id: health
        continue-on-error: true
        uses: ./.github/actions/bot-health
        with:
          expect-version: ${{ github.sha }}
          restart: "true"
          fail-on-unhealthy: "false"

      - name: Roll back the release tag
        id: rollback_tag
        if: steps.health.outputs.result == 'fail' && steps.prev.outputs.sha != ''
        env:
          PREV: ${{ steps.prev.outputs.sha }}
        run: |
          echo "::warning::${{ github.sha }} is unhealthy; rolling back to $PREV"
          aws ssm put-parameter --name "$SSM_IMAGE_TAG_PARAM" --value "$PREV" --type String --overwrite

      # A release from before /healthz existed has no endpoint: allow-no-endpoint
      # checks its systemd state and release link instead.
      - name: Restart bot on the previous release and check it
        id: rollback_health
        if: steps.rollback_tag.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/bot-health
        with:
          expect-version: ${{ steps.prev.outputs.sha }}
          restart: "true"
          allow-no-endpoint: "true"
          fail-on-unhealthy: "false"

      - name: Honeycomb marker (rollback)
        if: steps.rollback_tag.outcome == 'success'
        uses: ./.github/actions/honeycomb-marker
        with:
          token: ${{ secrets.HONEYCOMB_MARKER_TOKEN }}
          type: rollback
          start-time: ${{ steps.started.outputs.at }}
          message: rollback ${{ github.sha }} -> ${{ steps.prev.outputs.sha }}

      # The job ends red when the new release is not healthy, rolled back or not.
      # Not when an earlier step failed (health is then skipped) or on cancel.
      - name: Fail the deploy
        if: ${{ !cancelled() && steps.health.conclusion != 'skipped' && steps.health.outputs.result != 'ok' }}
        env:
          NEW_SHA: ${{ github.sha }}
          PREV_SHA: ${{ steps.prev.outputs.sha }}
          RESULT: ${{ steps.health.outputs.result }}
          REASON: ${{ steps.health.outputs.reason }}
          ROLLBACK_TAG: ${{ steps.rollback_tag.outcome }}
          ROLLBACK_RESULT: ${{ steps.rollback_health.outputs.result }}
          ROLLBACK_REASON: ${{ steps.rollback_health.outputs.reason }}
        run: |
          {
            echo "### Deploy of \`${NEW_SHA:0:12}\` failed its health check"
            echo
            echo "- result: **${RESULT:-no result (the check step crashed)}**: ${REASON:-see the step log}"
            case "$RESULT/$ROLLBACK_TAG" in
              /*)
                echo "- not rolled back: the check step produced no result, so the state of the instance is unknown. \`image_tag\` holds \`${NEW_SHA:0:12}\`; run the Instance Status workflow." ;;
              error/*)
                echo "- not rolled back: the check could not run, so the state of the instance is unknown. \`image_tag\` holds \`${NEW_SHA:0:12}\`; run the Instance Status workflow." ;;
              fail/success)
                echo "- rolled back once to \`${PREV_SHA:0:12}\` (\`image_tag\` now holds it); check of the old release: **${ROLLBACK_RESULT:-no result}**: ${ROLLBACK_REASON:-see the step log}" ;;
              fail/failure)
                echo "- the rollback to \`${PREV_SHA:0:12}\` could not write \`image_tag\`; it still holds \`${NEW_SHA:0:12}\`" ;;
              *)
                echo "- no rollback target (first deploy, a re-run of this commit, or no artifact for the previous release): \`image_tag\` still holds \`${NEW_SHA:0:12}\`" ;;
            esac
            echo
            echo "Re-running this workflow on the same commit redeploys the same release. Push a fix, or re-run an earlier good commit."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::deploy of $NEW_SHA is unhealthy: ${REASON:-no reason}"
          exit 1

      - name: Honeycomb marker
        if: steps.health.outputs.result == 'ok'
        uses: ./.github/actions/honeycomb-marker
        with:
          token: ${{ secrets.HONEYCOMB_MARKER_TOKEN }}
          type: deploy
          start-time: ${{ steps.started.outputs.at }}

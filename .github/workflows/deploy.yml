name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AWS_REGION: ca-central-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openai-discord-bot
  # The bot runs as a native binary from the private artifacts bucket
  # (terraform/artifacts.tf); the image above is still published.
  ARTIFACTS_BUCKET: openai-discord-bot-prod-artifacts
  RELEASE_NAME: danbot
  RELEASE_FILE: danbot-linux-arm64.tar.gz
  # Holds the git sha the instance runs (the name predates the native binary)
  SSM_IMAGE_TAG_PARAM: /openai-discord-bot/prod/image_tag
  SSM_KAGI_API_KEY_PARAM: /openai-discord-bot/prod/kagi_api_key

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Known-vulnerable dependencies must not block a hotfix deploy; govulncheck gates PRs instead
      run-govulncheck: false
    permissions:
      contents: read

  deploy:
    needs: ci
    environment: production
    runs-on: ubuntu-24.04-arm
    concurrency: production
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same ldflags as the Dockerfile (deploy.version = git sha). The tarball
      # is deterministic, so a re-run of the same commit builds the same bytes.
      - name: Build bot binary
        run: scripts/build-release.sh "${{ github.sha }}" arm64

      # artifacts/<name>/<git sha>/<file> with <file>.sha256 next to it, which
      # the instance checks on every start (fetch-artifact in user-data). A
      # version is never overwritten: a re-run that built other bytes fails.
      - name: Upload bot binary to S3
        run: |
          KEY="artifacts/$RELEASE_NAME/${{ github.sha }}/$RELEASE_FILE"
          SHA=$(awk '{ print $1 }' "dist/$RELEASE_FILE.sha256")
          if ! aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" 2>/dev/null; then
            echo "::error::bucket $ARTIFACTS_BUCKET does not exist yet: run the Terraform workflow, then re-run this workflow"
            exit 1
          fi
          if EXISTING=$(aws s3 cp "s3://$ARTIFACTS_BUCKET/$KEY.sha256" - 2>/dev/null | awk '{ print $1 }') && [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$SHA" ]; then
              echo "s3://$ARTIFACTS_BUCKET/$KEY already holds sha256 $SHA; nothing to do"
              exit 0
            fi
            echo "::error::s3://$ARTIFACTS_BUCKET/$KEY exists with sha256 $EXISTING, this build is $SHA. Versions are never overwritten."
            exit 1
          fi
          # Binary first, checksum last: a fetch never sees a .sha256 for a
          # file that is not there yet.
          aws s3 cp --only-show-errors "dist/$RELEASE_FILE" "s3://$ARTIFACTS_BUCKET/$KEY"
          aws s3 cp --only-show-errors "dist/$RELEASE_FILE.sha256" "s3://$ARTIFACTS_BUCKET/$KEY.sha256"
          echo "Uploaded s3://$ARTIFACTS_BUCKET/$KEY (sha256 $SHA)"
          {
            echo "### Bot binary ${{ github.sha }}"
            echo
            echo "- key: \`$KEY\`"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "${{ env.SSM_IMAGE_TAG_PARAM }}" \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

      # The bot reads the key from SSM when it starts (danbot-prepare.sh), so this
      # runs before the restart. The parameter itself is created by terraform.
      - name: Sync Kagi API key to SSM
        env:
          KAGI_API_KEY: ${{ secrets.KAGI_API_KEY }}
        run: |
          if [ -z "$KAGI_API_KEY" ]; then
            echo "::notice::KAGI_API_KEY secret is not set; link summaries stay disabled"
            exit 0
          fi
          ERR_FILE="$RUNNER_TEMP/kagi-ssm-get.err"
          if ! CURRENT=$(aws ssm get-parameter --name "$SSM_KAGI_API_KEY_PARAM" --with-decryption \
            --query 'Parameter.Value' --output text 2>"$ERR_FILE"); then
            # Only a missing parameter means "not created yet"; anything else
            # (usually AccessDenied) is reported as its own error.
            if grep -q 'ParameterNotFound' "$ERR_FILE"; then
              echo "::warning::$SSM_KAGI_API_KEY_PARAM does not exist yet; run the Terraform workflow, then deploy again"
            elif grep -q 'AccessDenied' "$ERR_FILE"; then
              echo "::error::AccessDenied reading $SSM_KAGI_API_KEY_PARAM. The deploy role needs ssm:GetParameter on it (and kms:Decrypt on its key). The Kagi key was not synced."
            else
              echo "::error::could not read $SSM_KAGI_API_KEY_PARAM: $(cat "$ERR_FILE")"
            fi
            exit 0
          fi
          if [ "$CURRENT" = "$KAGI_API_KEY" ]; then
            echo "Kagi API key is up to date"
            exit 0
          fi
          aws ssm put-parameter --name "$SSM_KAGI_API_KEY_PARAM" --value "$KAGI_API_KEY" \
            --type SecureString --overwrite > /dev/null
          echo "Kagi API key updated"

      - name: Restart bot via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=openai-discord-bot" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=["systemctl restart bot","sleep 10","systemctl is-active bot","journalctl -u bot -o cat --since -2min | grep danbot-prepare | tail -n 1 || true"]' \
            --query "Command.CommandId" \
            --output text)
          echo "Command: $CMD_ID"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=openai-discord-bot" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          echo "Instance: $INSTANCE_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      - name: Honeycomb marker
        if: success()
        uses: ./.github/actions/honeycomb-marker
        with:
          token: ${{ secrets.HONEYCOMB_MARKER_TOKEN }}
          type: deploy
          start-time: ${{ steps.started.outputs.at }}

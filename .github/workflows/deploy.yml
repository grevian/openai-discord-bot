name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AWS_REGION: ca-central-1
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openai-discord-bot
  SSM_IMAGE_TAG_PARAM: /openai-discord-bot/prod/image_tag

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04-arm
    concurrency: production
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1800

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "${{ env.SSM_IMAGE_TAG_PARAM }}" \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

      - name: Restart bot via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=openai-discord-bot" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=["systemctl restart bot"]' \
            --query "Command.CommandId" \
            --output text)
          echo "Command: $CMD_ID"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=openai-discord-bot" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          echo "Instance: $INSTANCE_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

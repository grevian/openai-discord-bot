receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  host_metrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.time:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load:
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true

  journald:
    units:
      - bot.service
      - otel-collector.service
    priority: info

processors:
  # First in every pipeline. Sized for a small instance: the collector idles
  # at ~40 MB RSS; it refuses data (the bot's SDK retries) from 75 MiB of Go
  # heap and forces a GC at 100 MiB. GOMEMLIMIT=80MiB and MemoryMax=128M are
  # set in the systemd unit (terraform/user-data.sh.tftpl).
  memory_limiter:
    check_interval: 1s
    limit_mib: 100
    spike_limit_mib: 25
  batch:

exporters:
  otlp_grpc/traces:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
  otlp_grpc/metrics:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
  otlp_grpc/host_metrics:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      x-honeycomb-dataset: "host_metrics"
  otlp_grpc/logs:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/traces]
    metrics/application:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/metrics]
    metrics/host:
      receivers: [host_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/host_metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/logs]
    logs/journald:
      receivers: [journald]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/logs]

# OpenTelemetry Collector Builder (ocb) manifest for the collector on the bot
# instance. It holds exactly the components adot/otel-agent-config.yaml uses,
# instead of the ~420 MB otelcol-contrib distribution.
#
# Build: otelcol/build.sh (also run by .github/workflows/otelcol.yml).
# Every component is pinned to the same collector release. To upgrade, bump
# all versions together (core modules and contrib modules share the minor
# version), bump OTELCOL_VERSION in build.sh, and see otelcol/README.md.
dist:
  name: otelcol-danbot
  description: Minimal OpenTelemetry Collector for the danbot instance
  module: github.com/grevian/openai-discord-bot/otelcol-danbot
  version: 0.164.0-danbot.1
  output_path: ./_build

receivers:
  # traces, metrics and logs from the bot
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  # cpu, memory, load and filesystem scrapers
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.0
  # otel-collector.service logs, read by running journalctl (the bot ships its own over OTLP)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.164.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0

exporters:
  # OTLP/gRPC to Honeycomb
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0

providers:
  # --config=/etc/otel/config.yaml and ${env:HONEYCOMB_API_KEY}
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
